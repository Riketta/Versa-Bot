[package]
name = "versa-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
bon = "3.9.1"

config = {
  version = "0.15.25",
  default-features = false,
  features = [
    "async",
    "convert-case",
    "toml",
  ]
}
parking_lot = "0.12.5"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
reqwest = { version = "0.12", features = ["socks"] }
sentry = { version = "0.49", default-features = false, features = [
  "ureq",
  "rustls",
  "backtrace",
  "contexts",
  "panic",
  "tracing",
] }
sentry-tracing = "0.49"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
  "postgres",
  "migrate",
] }
serenity = {
  version = "0.12.5",
  features = ["client", "gateway", "model", "rustls_backend"]
}
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
indexing_slicing = "deny"
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
string_slice = "deny"
# unwrap_used = "deny"
