[package]
name = "versa-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.22"
bon = "3.9.1"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
] }

config = {
  version = "0.15.25",
  default-features = false,
  features = [
    "convert-case",
    "toml",
  ]
}
parking_lot = "0.12.5"
rand = "0.9"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls", "stream"] }
sentry = { version = "0.49", default-features = false, features = [
  "ureq",
  "rustls",
  "backtrace",
  "contexts",
  "panic",
  "tracing",
] }
sentry-tracing = { version = "0.49", features = ["logs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
  "postgres",
  "migrate",
] }
serenity = {
  version = "0.12.5",
  features = ["client", "gateway", "model", "rustls_backend"]
}
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal", "sync", "time", "macros", "net", "io-util"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Virtual tokio time (`start_paused = true`) for deterministic scheduler tests.
tokio = { version = "1.53.1", features = ["test-util"] }

[lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
indexing_slicing = "deny"
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
string_slice = "deny"
unwrap_used = "deny"
