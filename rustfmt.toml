# Stable-channel rustfmt only: every option here is supported by the pinned
# toolchain (rust:1.98-bookworm in CI and Docker), so `cargo fmt --check`
# enforces exactly this configuration everywhere. Nightly-only options are
# deliberately absent - stable silently ignores them, which would make the
# CI gate weaker than the local style.
use_field_init_shorthand = true
use_small_heuristics = "Max"
