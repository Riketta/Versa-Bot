# VersaBot Compose deployment. This file contains no secrets: they live in
# `.env` next to it (gitignored) - copy `.env.example` and fill it in:
#
#   cp .env.example .env   # then edit
#   docker compose up -d
#
# SQLite state lives in the `versa-bot-data` volume; the commented `db`
# service below switches storage to PostgreSQL.

services:
  versa-bot:
    # Built by CI on every push to main and v* tags (see README "Docker").
    image: ghcr.io/riketta/versa-bot:latest
    container_name: versa-bot
    restart: unless-stopped
    # Injected into the container and available for ${...} substitution.
    # Compose fails fast when the file is missing - create it first.
    env_file: .env
    environment:
      # SQLite inside the volume; comment out when switching to PostgreSQL.
      # `environment` wins over values coming from .env.
      VERSABOT__STORAGE__URL: sqlite:///data/versabot.db
      # PostgreSQL, together with the db service below; password from .env:
      # VERSABOT__STORAGE__URL: postgres://versa_bot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/versa_bot
      # Log levels: default is info. Serenity logs shard/gateway state only
      # at debug - use this preset when troubleshooting the gateway.
      # RUST_LOG: versa_bot=info,serenity=debug
    volumes:
      - versa-bot-data:/data
      # Config-file style instead of env vars: the bot reads ./versabot.toml
      # from its working directory.
      # - ./versabot.toml:/app/versabot.toml:ro
    # Only needed together with PostgreSQL:
    # depends_on:
    #   db:
    #     condition: service_healthy

  # db:
