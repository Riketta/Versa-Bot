# Checked-in configuration template. Copy it to `versabot.toml`
# (gitignored) and fill in the real values.

# Verbose (debug-level) logging; RUST_LOG overrides it entirely.
debug = true

[discord]
token = "YOUR_TOKEN"
# SOCKS/HTTP proxy for the Discord API, if your network needs one.
# proxy = "socks5://127.0.0.1:1080"

[storage]
# SQLite for development; PostgreSQL in production, e.g.
# url = "postgres://user:password@host/versa_bot"
url = "sqlite://versabot.db"

# Sentry-protocol endpoint: Sentry SaaS or self-hosted GlitchTip.
# The address to report to is the DSN host - no separate URL needed.
# Remove the section (or leave dsn empty) to disable reporting entirely.
# [sentry]
# dsn = "http://your-key@localhost:9000/1"
# environment = "development"
# Performance-transaction sample rate (0.0..=1.0); omit for error-only
# reporting. Low rates like 0.01 keep the data volume down.
# traces_sample_rate = 0.01

# Optional: status rotator - cycles the bot's activity through the list.
# Presence is bot-wide (not per-guild). Remove the section, empty the list,
# or set interval_seconds to 0 to disable the rotation.
# [status]
# interval_seconds = 300
# statuses = ["with the API", "versa-bot", "over the guild"]

# Optional: LLM chat runtime. This section is the bot operator's domain -
# guild admins only pick among the declared models via /llm_assign and
# /llm_set, never configure endpoints. Startup-only: changes require a
# restart. Without the section the chat engine has no providers.
# [llm]
# default_system_prompt = "You are a helpful chat assistant."
# default_compaction_prompt = "Summarize the conversation above, preserving facts, decisions, names and open questions. Be concise."
# compaction_keep_tail = 10
# max_message_length = 2000
# stream_interval_ms = 2000

# Providers are OpenAI-compatible endpoints. `api_key_env` names the
# environment variable holding the key (local endpoints may omit it);
# optional per-provider `proxy` and `timeout_secs`.
# [llm.providers.zai]
# api_url = "https://api.z.ai/api/coding/paas/v4"
# api_key_env = "VERSABOT_LLM_ZAI_KEY"
# reasoning_style = "openai_effort"   # or "glm_thinking"
#
# [llm.providers.local]
# api_url = "http://192.168.1.35:8001/v1"
# timeout_secs = 180

# Model capability declarations. Undeclared models are usable but get
# default capabilities (no reasoning parameter is ever sent for them).
# `context_window` (total tokens) enables token-budget context filling for
# channels without an explicit budget: the prompt is filled newest-first up
# to the window minus the completion reserve and a safety margin, once the
# endpoint has reported its first usage (before that, the per-channel
# message limit fills the context).
# [llm.models."zai/glm-5.3-flash"]
# reasoning = true
# context_window = 131072
#
# [llm.models."local/unsloth/gemma-4-26B-A4B-it-qat-GGUF"]
# reasoning = false
# context_window = 32768
