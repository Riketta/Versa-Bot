# Checked-in configuration template. Copy it to `versabot.toml`
# (gitignored) and fill in the real values.

# Verbose logging for the bot's own internals. The third-party HTTP stack
# (reqwest/hyper) stays at warn even in debug mode - its per-request logs
# embed full client dumps and drown everything else. RUST_LOG overrides
# this entirely: RUST_LOG=debug brings the noise back, or tune per crate,
# e.g. RUST_LOG="info,versa_bot=debug,serenity=debug".
debug = true

[discord]
token = "YOUR_TOKEN"
# SOCKS/HTTP proxy for Discord REST calls. REST only - the gateway WebSocket
# bypasses it; on proxy-only networks route the whole container through the
# proxy at network level (see README, "Running behind a proxy").
# proxy = "socks5://127.0.0.1:1080"

[storage]
# SQLite for development; PostgreSQL in production, e.g.
# url = "postgres://user:password@host/versa_bot"
url = "sqlite://versabot.db"

# Sentry-protocol endpoint: Sentry SaaS or self-hosted GlitchTip.
# The address to report to is the DSN host - no separate URL needed.
# Remove the section (or leave dsn empty) to disable reporting entirely.
# [sentry]
# dsn = "http://your-key@localhost:9000/1"
# environment = "development"
# Performance-transaction sample rate (0.0..=1.0); omit for error-only
# reporting. Low rates like 0.01 keep the data volume down.
# traces_sample_rate = 0.01

# Optional: persistent file logging. Startup-only: the subscriber is
# installed once at boot, changes require a restart. Remove the section
# to log to stdout only (containers usually prefer the Docker logging
# driver; otherwise mount a volume to keep the files).
# [logging]
# Log directory - created at boot; failure to create it aborts startup.
# dir = "logs"
# "daily" writes one file per day (versa-bot.log.2026-10-05); "never"
# appends to a single versa-bot.log (pair with an external rotator).
# Files are never pruned automatically.
# rotation = "daily"
# Independent filter for the file layer (RUST_LOG never affects it).
# Default: flight recorder - the bot's breadcrumbs at debug even when
# stdout runs quieter, third-party HTTP stack at warn. Add
# "llm_raw_traffic=debug" to also capture full LLM request/response
# bodies to the file (see the [llm] log_raw_traffic note below).
# level = "info,versa_bot=debug,reqwest=warn,hyper=warn,hyper_util=warn"

# Optional: LLM chat runtime. This section is the bot operator's domain -
# guild moderators only pick among the declared models via /llm_assign
# and /llm_set, never configure endpoints. Startup-only: changes require
# a restart. Without the section the chat engine has no providers.
# [llm]
# default_system_prompt = "You are a helpful chat assistant."
# default_compaction_prompt = "Summarize the conversation above, preserving facts, decisions, names and open questions. Be concise."
# Live messages kept after each compaction (minimum 1 - zero would make
# compaction unreachable).
# compaction_keep_tail = 10
# max_message_length = 2000
# Streaming edit cadence while a channel streams its answer live
# (`streaming` on); the final edit always carries the exact full text.
# Floored at 250 ms - faster cadences would hammer Discord's edit limit.
# stream_interval_ms = 2000
# Cap for /llm_prompt_file attachment downloads, in bytes.
# max_prompt_file_bytes = 131072
# Collapse runs of consecutive newlines in completions down to this many
# (e.g. 2 = at most one blank line between paragraphs). Absent = responses
# left untouched. Applied to the authoritative final text - a streaming
# message may briefly show more blank lines than the final edit keeps.
# max_consecutive_newlines = 2
# Cap on emoji reactions applied per answer. The model asks via a
# [[react: ...]] marker, which is stripped before the answer is shown;
# channels opt in via /llm_set react on.
# react_max_per_message = 3
#
# Image recognition: attached images in assigned channels are described by
# a vision-capable model at capture time; the description is stored with
# the message and rendered into the context as a markdown image reference
# (![description](image.png)). Channels opt in via /llm_set images on.
# Absent image_model = recognition off globally, whatever channels set.
# image_model = "local/unsloth/gemma-4-26B-A4B-it-qat-GGUF"
# Recognition prompt; channels can override per-channel
# (/llm_set image_prompt). Text below is the built-in default.
# image_prompt = "Describe this image concisely for a chat transcript: the scene, notable objects and people, and any visible text verbatim."
# Images are rescaled to this max side (aspect kept) before recognition;
# smaller images pass through. Keeps cost and latency low.
# image_max_side = 512
# JPEG quality of the rescaled recognition payload.
# image_jpeg_quality = 85
# Download cap per image attachment, in bytes; larger images are recorded
# undescribed.
# image_max_source_bytes = 8388608
# Cap on images described per captured message; images beyond it are
# recorded undescribed.
# max_images_per_message = 2
#
# Diagnostic: dump every LLM request and response body at DEBUG level,
# under the dedicated `llm_raw_traffic` target - stdout only, never
# Sentry, and captured to `[logging]` files only when that target is
# named in `[logging].level`. The bodies carry full conversation
# content - enable only while debugging a provider.
# log_raw_traffic = false

# Providers are OpenAI-compatible endpoints. `api_key_env` NAMES the
# environment variable holding the key - it must never contain the key
# itself (keys never live in config files or guild storage); local
# endpoints may omit it. Optional per-provider `proxy` and `timeout_secs`.
# [llm.providers.zai]
# api_url = "https://api.z.ai/api/coding/paas/v4"
# api_key_env = "VERSABOT_LLM_ZAI_KEY"   # then: VERSABOT_LLM_ZAI_KEY=<key> in the environment
# How the reasoning parameter is rendered. "openai_effort" sends
# reasoning_effort: "<value>"; the effort scale has no off wire value, so
# per-channel `off` omits it and the endpoint default applies - Z.ai GLM
# defaults to `max` effort (heavy thinking; GLM-5.3 series thinks
# forcibly, `low` is the minimum). "glm_thinking" sends the boolean
# thinking: {"type": "enabled"|"disabled"} switch, where `off` renders a
# real disable (honored by GLM-4.5 through 5.2).
# reasoning_style = "openai_effort"
#
# [llm.providers.local]
# api_url = "http://192.168.1.35:8001/v1"
# Request timeout in seconds (minimum 1).
# timeout_secs = 180
# Provider-specific fields merged into every completion body - knobs the
# adapter does not model. llama.cpp example: stop a thinking template from
# thinking (the per-channel reasoning_effort scale means nothing to it).
# `model`/`messages` cannot be overridden.
# extra_body = { chat_template_kwargs = { enable_thinking = false } }
# or, on servers that support the budget field:
# extra_body = { reasoning_budget = 0 }
# String values may carry template variables resolved per request from the
# channel's reasoning setting - `/llm_set reasoning_effort=off` then
# reaches templates too:
# extra_body = { chat_template_kwargs = { enable_thinking = "${enable_reasoning}" } }
# ${enable_reasoning}: JSON false only when the channel sets
# reasoning_effort=off, else true (unset = provider default = on).
# ${reasoning_effort}: the effort string ("low"/"high"/...), or null when
# unset or off. Unknown variables stay literally in place and warn.

# Model capability declarations. Undeclared models are usable but get
# default capabilities (no reasoning parameter is ever sent for them).
# `context_window` (total tokens) enables token-budget context filling for
# channels without an explicit budget: the prompt is filled newest-first up
# to the window minus the completion reserve and a safety margin, once the
# endpoint has reported its first usage (before that, the per-channel
# message limit fills the context).
# [llm.models."zai/glm-5.3-flash"]
# reasoning = true
# context_window = 131072
# How the compaction summary enters the context: "system_turn" (default)
# keeps it a separate second system message; "system_suffix" merges it
# into the end of the system prompt - the escape hatch for templates
# that silently drop later system turns, which would erase the summary
# after every compaction; "assistant_turn" posts it as an assistant
# message before the live window.
# summary_placement = "system_turn"
#
# [llm.models."local/unsloth/gemma-4-26B-A4B-it-qat-GGUF"]
# reasoning = false
# context_window = 32768

# Optional: status rotator - cycles the bot's activity through the list.
# Presence is bot-wide (not per-guild). Remove the section, empty the list,
# or set interval_seconds to 0 to disable the rotation.
# [status]
# interval_seconds = 300
# statuses = ["with the API", "versa-bot", "over the guild"]

# Optional: LoL store watcher - announces store events (new sales, new
# skins, Mythic Shop rotations, Your Shop start) from the locally running
# League client to a per-guild assigned channel (/lol_store_enable +
# /lol_store_assign). Startup-only: an absent section, an empty
# lockfile_path, or poll_secs = 0 keeps the watcher off. Your logged-in
# account is only the API key - no account data is ever read or announced.
# [lol_store]
# lockfile_path = "C:/Riot Games/League of Legends/lockfile"
# Host the client API listens on; the port always comes from the lockfile.
# address = "127.0.0.1"
# poll_secs = 300
# announce_sales = true
# announce_new_skins = true
# announce_mythic_rotation = true
# announce_yourshop = true
# Per-user / per-guild caps on /lol_store_watch subscriptions.
# watch_user_cap = 20
# watch_guild_cap = 300

# Optional: LoL leaderboard - the on-demand /lol_leaderboard statistics
# dump (role distributions, most picked champions per role) from a public
# leaderboard source. Startup-only: an absent section, no regions, or a
# zero request_interval_secs / parse_depth / cache_ttl_secs keeps the
# command in "not configured" mode. No per-guild setup - the command
# answers wherever it is invoked. All display windows (buckets, champ
# pool) are clamped to parse_depth.
# [lol_leaderboard]
# Regions (servers) to aggregate - empty = plugin off.
# regions = ["kr", "euw", "na"]
# Minimum delay in seconds between source requests (sequential).
# request_interval_secs = 1
# Top players parsed per region.
# parse_depth = 1000
# Player-count rows for the role-distribution tables.
# display_buckets = [300, 1000]
# Player pool (per region, best first) behind the champion tables.
# champ_pool_depth = 1000
# Champions listed per role.
# champs_per_role = 5
# How long cached data stays fresh (default 18h).
# cache_ttl_secs = 64800
# Optional proxy for source requests (socks5:// or http://).
# proxy = "socks5://192.168.1.35:8081"
