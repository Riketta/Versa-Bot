# CI for versa-bot: tests, then Docker image build + push to GHCR.
#
# Image: ghcr.io/<owner>/versa-bot
#   - sha-<8>   always
#   - latest    pushes to main (and manual runs on main)
#   - v*        matching git tag pushes
#
# GHCR login uses the automatic GITHUB_TOKEN (packages: write) - no extra
# secrets needed, unlike the Forgejo workflow.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Same pinned image as the Forgejo test job and the Dockerfile build
      # stage (suite + compiler).
      image: rust:1.98-bookworm
    services:
      # The optional PostgreSQL arms of the sqlx_storage suite (they skip
      # without VERSABOT_TEST_PG_URL): a throwaway database, migrated by
      # the tests themselves. Reachable by the service alias as hostname.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: versa_bot_test
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rustfmt (verify formatting)
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

      - name: Clippy (deny-level lints gate)
        run: |
          rustup component add clippy
          cargo clippy --all-targets --locked

      - name: Tests
        env:
          # Hostname = the service alias; the job container and the services
          # share the job's network.
          VERSABOT_TEST_PG_URL: postgres://postgres:postgres@postgres:5432/versa_bot_test
        run: cargo test --locked

  docker:
    needs: [test]
    # Main pushes and v* tag pushes only; manual runs on feature branches
    # must not silently publish images.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        # Explicit 8-char short, matching the Forgejo workflow's tag scheme
        # (metadata-action's type=sha uses a different default length).
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ env.SHORT_SHA }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
