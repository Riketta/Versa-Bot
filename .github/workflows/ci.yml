# CI for versa-bot: tests, then Docker image build + push to GHCR.
#
# Image: ghcr.io/<owner>/versa-bot
#   - sha-<8>   always
#   - latest    pushes to main (and manual runs on main)
#   - v*        matching git tag pushes
#
# GHCR login uses the automatic GITHUB_TOKEN (packages: write) - no extra
# secrets needed, unlike the Forgejo workflow.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Same image as the Forgejo test job; ships git + cargo, no clippy.
      image: rust:1.98
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rustfmt (verify formatting)
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

      - name: Clippy (deny-level lints gate)
        run: |
          rustup component add clippy
          cargo clippy --all-targets

      - name: Tests
        run: cargo test

  docker:
    needs: [test]
    # Main pushes and v* tag pushes only; manual runs on feature branches
    # must not silently publish images.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
